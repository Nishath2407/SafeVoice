<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SafeVoice — Reset Password</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;
    background:linear-gradient(135deg,#1a0533,#2d1060,#0f2044);
    display:flex;align-items:center;justify-content:center;padding:1rem}
  .card{background:rgba(255,255,255,.09);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12);border-radius:24px;
    padding:2.5rem;max-width:420px;width:100%;text-align:center}
  .icon{font-size:3rem;margin-bottom:1rem}
  h1{color:#c4b5fd;font-size:1.5rem;margin-bottom:.5rem}
  p{color:rgba(255,255,255,.65);font-size:.9rem;line-height:1.6;margin-bottom:1.5rem}
  .flash{padding:.75rem 1rem;border-radius:12px;margin-bottom:1rem;font-size:.88rem}
  .flash.success{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#6ee7b7}
  .flash.danger{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
  input{width:100%;padding:.8rem 1rem;border-radius:12px;
    border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);
    color:#fff;font-size:.95rem;outline:none;margin-bottom:.8rem}
  input::placeholder{color:rgba(255,255,255,.35)}
  input:focus{border-color:#c4b5fd}
  .strength{height:4px;border-radius:2px;margin-bottom:.8rem;
    background:rgba(255,255,255,.1);transition:all .3s;width:0%}
  button{width:100%;padding:.85rem;border-radius:14px;border:none;
    background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;
    font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
  button:hover{opacity:.9;transform:translateY(-2px)}
  .rule{font-size:.78rem;color:rgba(255,255,255,.4);margin-bottom:.8rem;text-align:left}
  .back{display:block;margin-top:1rem;color:rgba(255,255,255,.5);font-size:.85rem;text-decoration:none}
  .back:hover{color:#c4b5fd}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔑</div>
  <h1>Set New Password</h1>
  <p>Choose a strong new password for your SafeVoice therapist account.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <input type="hidden" name="token" value="{{ token }}"/>
    <input type="password" name="password" id="pw" placeholder="New password (min 8 chars)"
           required oninput="checkStrength(this.value)"/>
    <div class="strength" id="strengthBar"></div>
    <div class="rule" id="strengthLabel">Enter a password to check strength</div>
    <input type="password" name="confirm" placeholder="Confirm new password" required/>
    <button type="submit">Reset My Password</button>
  </form>
  <a class="back" href="/login">← Back to Login</a>
</div>
<script>
const LABELS=['Too short','Weak','Moderate','Strong','Very Strong'];
const COLORS=['#ef4444','#f59e0b','#10b981','#6366f1'];
function checkStrength(v) {
  let s=0;
  if(v.length>=8) s++;
  if(/[A-Z]/.test(v)) s++;
  if(/[0-9]/.test(v)) s++;
  if(/[^A-Za-z0-9]/.test(v)) s++;
  const bar=document.getElementById('strengthBar');
  const lbl=document.getElementById('strengthLabel');
  bar.style.width=(s*25)+'%';
  bar.style.background=COLORS[s-1]||'rgba(255,255,255,.1)';
  lbl.textContent='Password strength: '+(LABELS[s]||LABELS[0]);
  lbl.style.color=COLORS[s-1]||'rgba(255,255,255,.4)';
}
</script>
</body>
</html>
